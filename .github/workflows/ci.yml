# ─── CI ───────────────────────────────────────────────────────────────────────
# PR gate (lint/typecheck/test/build) runs on every pull request. A push to
# main/staging is always a merge of a PR that already ran the gate — it does
# NOT re-run the same checks. Instead it runs a different, merge-only
# pipeline: build+serve Playwright e2e for all three apps, plus a live
# post-deploy smoke check against the real Vercel URLs once Vercel's own
# Git integration has deployed the new commit.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── PR gate ─────────────────────────────────────────────────────────────────
  # One runner: format, lint (type-aware ESLint), typecheck, boundaries, unit
  # tests, build — across every workspace via turbo. `if: always()` on each
  # step so one run reports every failure instead of stopping at the first.
  gate:
    name: Lint, typecheck, test, build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Format
        id: format
        run: pnpm format:check

      - name: Lint
        id: lint
        if: always()
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        if: always()
        run: pnpm typecheck

      - name: Architecture boundaries
        id: boundaries
        if: always()
        run: pnpm boundaries

      - name: Test
        id: test
        if: always()
        run: pnpm test:coverage

      # Each app validates its own env at build time (`@c1rcle/config`). CI has
      # no real secrets to build against, so each app's own `.env.example`
      # (placeholder values, safe to commit) stands in — same convention the
      # `dev:staging` / `dev:prod` scripts already use locally, just pointed
      # at the example file instead of a real one.
      - name: Seed placeholder env for build
        id: seed-env
        if: always()
        run: |
          for app in guest-portal partner-dashboard admin-console; do
            if [ -f "apps/$app/.env.example" ]; then
              cp "apps/$app/.env.example" "apps/$app/.env.local"
            fi
          done

      # scanner-app uses Expo's EXPO_PUBLIC_* convention (a different prefix
      # and inlining mechanism than the Next.js apps' NEXT_PUBLIC_*/.env.local
      # above), read via a plain .env file rather than app.config.ts's own
      # process.env access — kept as its own step rather than folded into
      # the loop above, which assumes one shared shape across all four apps.
      - name: Seed placeholder env for scanner-app build
        id: seed-env-scanner
        if: always()
        run: cp apps/scanner-app/.env.example apps/scanner-app/.env

      # Expo native deps must stay inside the SDK 55 tested set. `expo install
      # --check` fails on drift (e.g. react-native-screens pulled out of the
      # ~4.23.0 range — a newer 4.x breaks the RN 0.83 codegen on CI with
      # "SearchBarNativeComponent.ts: The first argument of method blur must be
      # of type React.ElementRef<>"). Fix drift with `npx expo install <pkg>`,
      # never a manual version bump. Runs before Build so a regression gets a
      # clear, fast failure instead of a cryptic codegen error minutes later.
      - name: Check Expo native deps stay in SDK range
        id: expo-deps
        if: always()
        working-directory: apps/scanner-app
        run: npx expo install --check

      - name: Build
        id: build
        if: always()
        run: pnpm build

      - name: Summarize
        if: always()
        run: |
          {
            echo "| Check | Result |"
            echo "| --- | :--- |"
            echo "| Format | ${{ steps.format.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Boundaries | ${{ steps.boundaries.outcome }} |"
            echo "| Test | ${{ steps.test.outcome }} |"
            echo "| Expo deps | ${{ steps.expo-deps.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Merge-only: local e2e ───────────────────────────────────────────────────
  # Builds each app and runs its Playwright suite against a locally-served
  # instance (turbo's `test:e2e` task already wires build -> serve -> test).
  # This is NOT re-running the PR gate — it is the one check that only makes
  # sense once code has actually merged, because it exercises full page loads
  # end-to-end rather than unit-level assertions.
  e2e:
    name: End-to-end (local build)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # scanner-app is deliberately excluded — Playwright drives a browser
      # against a served Next.js app; it has no target here (native app,
      # no Playwright equivalent in this repo yet). Don't add it to this
      # matrix; a native E2E effort gets its own job under its own tool.
      matrix:
        app: [guest-portal, partner-dashboard, admin-console]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Seed placeholder env for build
        run: |
          if [ -f "apps/${{ matrix.app }}/.env.example" ]; then
            cp "apps/${{ matrix.app }}/.env.example" "apps/${{ matrix.app }}/.env.local"
          fi

      - name: Install Playwright browsers
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run e2e suite
        env:
          CI: "true"
        run: pnpm turbo run test:e2e --filter=./apps/${{ matrix.app }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 14

  # ── Merge-only: post-deploy smoke ───────────────────────────────────────────
  # Vercel's own Git integration deploys on push, out of band from this
  # workflow (same relationship the backend has with Render). This waits a
  # short grace period for that deploy to land, then hits each app's real
  # public URL and asserts it actually serves a page — catches the class of
  # bug a local `pnpm build` cannot: a broken env var or alias on the
  # platform itself.
  post-deploy-smoke:
    name: Post-deploy smoke (live URLs)
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel to deploy
        run: sleep 90

      - name: Smoke-check live apps
        run: |
          set -euo pipefail
          fail=0
          for url in \
            https://c1rcle-v2-guest-portal.vercel.app \
            https://c1rcle-v2-admin-console.vercel.app \
            https://c1-rcle-frontend-partner-dashboard.vercel.app \
            ; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "  OK  $url -> $status"
            else
              echo "::error::$url returned $status"
              fail=1
            fi
          done
          exit $fail

  # ── Merge-only: admin-console production verification + auto-rollback ──────
  # The generic post-deploy-smoke job above only triggers on a push to
  # `staging` and only checks that each app's URL returns 2xx/3xx — it never
  # ran against `main`, which is the branch Vercel actually treats as
  # `production` for this project (verified against the live Vercel API:
  # the project's domains include a `-git-main-` alias and
  # `latestDeployment.target` is `production`). That meant production
  # deploys of the admin console had NO automated smoke coverage and NO
  # rollback at all. This job closes that gap, mirroring the backend's
  # `verify-deploy` job (wait for the right commit -> prove it works -> roll
  # back if it doesn't -> file an incident) but for Vercel instead of Render.
  #
  # Requires a `VERCEL_TOKEN` repo secret (a Vercel Access Token scoped to
  # this team) to confirm the exact commit deployed and to trigger a
  # rollback. Without it, this job still runs the live smoke test against
  # whatever is currently on the production domain (so a broken admin
  # console is still caught and files an incident) but cannot verify it is
  # testing the NEW build specifically, and cannot roll back automatically.
  verify-admin-console-deploy:
    name: Verify admin-console production deploy
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.thec1rcle.com
    permissions:
      contents: read
      issues: write # file an incident if smoke fails
    env:
      VERCEL_PROJECT_ID: prj_VvGU73UJ0pNytBWLQNLIyZhVSiB9
      VERCEL_TEAM_ID: team_5Naid4VopvVpMMsdDhhCCv6x
      # The project's stable Vercel alias, not www.thec1rcle.com: the custom
      # domain sits behind a Cloudflare bot challenge ("Performing security
      # verification") that blocks GitHub runners' headless browsers, so every
      # smoke assertion saw the challenge page instead of the app. The alias
      # serves the same production deployment.
      SMOKE_URL: https://c1rcle-v2-admin-console.vercel.app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Detect Vercel API credentials
        id: vercel-auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not set — this job cannot confirm the exact commit deployed, and automatic rollback is disabled. Add a Vercel Access Token as the VERCEL_TOKEN repo secret to enable both."
          fi

      - name: Wait for this commit to deploy on Vercel
        if: steps.vercel-auth.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node scripts/ci/wait-for-vercel-deploy.mjs \
            --project "$VERCEL_PROJECT_ID" --team "$VERCEL_TEAM_ID" \
            --sha "$GITHUB_SHA" --timeout 900 --interval 15

      # No token: best-effort grace period, same fallback the old
      # post-deploy-smoke job used, so there is still SOME coverage.
      - name: Grace period for Vercel to deploy (no token, cannot confirm commit)
        if: steps.vercel-auth.outputs.has_token != 'true'
        run: sleep 90

      - name: Install Playwright browsers
        working-directory: apps/admin-console
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Smoke test production (real browser, live URL)
        id: smoke
        working-directory: apps/admin-console
        run: pnpm exec playwright test --config playwright.prod.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-admin-console-prod
          path: apps/admin-console/playwright-report/
          retention-days: 14

      - name: Roll back the failed deploy
        if: failure() && steps.smoke.outcome == 'failure' && steps.vercel-auth.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node scripts/ci/vercel-rollback.mjs \
            --project "$VERCEL_PROJECT_ID" --team "$VERCEL_TEAM_ID" --sha "$GITHUB_SHA"

      - name: File a production incident
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ROLLBACK_ATTEMPTED: ${{ steps.vercel-auth.outputs.has_token }}
        with:
          script: |
            const title = `Admin console production smoke tests failed for ${context.sha.slice(0, 7)}`;
            const body = [
              'Post-deploy verification failed for admin-console on `main`.',
              '',
              `- Commit: ${context.sha}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Target: https://www.thec1rcle.com',
              `- Automatic rollback attempted: ${process.env.ROLLBACK_ATTEMPTED}`,
              '',
              "Check the run's Playwright report artifact for which assertions failed.",
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'production-incident',
            });
            const open = existing.data.find((issue) => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.number,
                body: `Recurred:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['production-incident'],
              });
            }

  # ── The single required status check for PRs ───────────────────────────────
  ci-ok:
    name: CI OK
    if: always() && github.event_name == 'pull_request'
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$bad" ]; then
            echo "::error::These gates did not pass: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "All gates green."
