# ─── Scheduled dependency audit ───────────────────────────────────────────────
# The PR gate (`Dependency audit` in ci.yml) only runs when someone opens a pull
# request, so a new advisory would stay invisible until the next PR. This runs the
# same audit on a schedule (Mondays 06:30 UTC, 12:00 IST) so a failure shows up in
# the Actions tab before it blocks anyone. It is not a required check.
name: Security

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
          turbo-cache: "false"
      - name: Audit dependencies (fail on high or critical)
        run: pnpm audit --audit-level=high
